spring:
  application:
    name: spring-ai-sample2
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
#      chat:
#        options:
#          model: gpt-5-mini
#          temperature: 0.9
#          top-p: 0.95
#          top-k: 40

#        NOTE: Key Considerations
#          Kebab-case: Spring Boot uses relaxed binding, so top-p is the standard format for properties files,
#                      though topP will usually be map-bound correctly as well.
#           Mutually Exclusive: OpenAI generally recommends adjusting either temperature or top-p,
#                      but not both at the same time, as they both modify the token selection pool.


logging:
  level:
    root: INFO
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
    # Spring AI 1.0.0-M6 / M7 / RC1:
    # org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
    # Early 1.x Spring AI Milestones
    # org.springframework.ai.advisor.SimpleLoggerAdvisor: DEBUG

    # In Spring boot 2.x, you could also get some web client related logs
    # org.springframework.we.client: DEBUG
